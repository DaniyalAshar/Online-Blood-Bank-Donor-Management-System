{% extends 'base.html' %}{% block title %}Donor Registration | LifeFlow{% endblock %}{% block content %}<section class="max-w-7xl mx-auto px-4 sm:px-6 py-12"><div class="max-w-3xl mx-auto"><a href="/" class="text-red-700 font-bold text-sm">← Back home</a><p class="text-red-600 font-bold uppercase text-sm mt-6">Donor community</p><h1 class="text-4xl md:text-5xl font-black mt-2">Register as a donor.</h1><p class="text-slate-600 mt-3">Demo profiles are not automatically eligible for donation matching.</p><form method="post" class="mt-8 bg-white border rounded-2xl p-6 md:p-8 grid sm:grid-cols-2 gap-5"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label class="text-sm font-bold">Full name<input required name="full_name" maxlength="120" class="mt-2 block w-full rounded-xl border p-3"></label><label class="text-sm font-bold">Email<input required type="email" name="email" maxlength="255" class="mt-2 block w-full rounded-xl border p-3"></label><label class="text-sm font-bold">Phone<input required name="phone" maxlength="25" class="mt-2 block w-full rounded-xl border p-3"></label><label class="text-sm font-bold">Blood group<select name="blood_type" class="mt-2 block w-full rounded-xl border p-3 bg-white">{% for g in blood_groups %}<option>{{g}}</option>{% endfor %}</select></label><label class="text-sm font-bold sm:col-span-2">City<input required name="city" maxlength="100" class="mt-2 block w-full rounded-xl border p-3" placeholder="e.g. Solapur"></label><label class="sm:col-span-2 flex gap-3 text-sm text-slate-600"><input type="checkbox" name="contact_consent" class="mt-1"><span>I consent to being contacted about donation opportunities. This demo sends no messages.</span></label><button class="sm:col-span-2 bg-red-600 text-white rounded-xl p-3.5 font-bold">Submit registration</button></form><p class="text-xs text-slate-500 mt-4">Use fictional details in demo environments.</p></div></section>{% endblock %}
