{% extends 'base.html' %}{% block title %}Blood Request | LifeFlow{% endblock %}{% block content %}<section class="max-w-7xl mx-auto px-4 sm:px-6 py-12"><div class="max-w-3xl mx-auto"><div class="rounded-2xl bg-red-50 border border-red-100 p-5"><p class="font-extrabold text-red-800">Emergency request demo</p><p class="text-red-700 text-sm mt-1">This form does not contact hospitals or alert donors. For urgent care, contact emergency services and a licensed blood bank directly.</p></div><h1 class="text-4xl font-black mt-7">Request blood support.</h1><form method="post" class="mt-7 bg-white border rounded-2xl p-6 md:p-8 grid sm:grid-cols-2 gap-5"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label class="text-sm font-bold">Requester name<input required name="requester_name" class="mt-2 block w-full rounded-xl border p-3"></label><label class="text-sm font-bold">Contact<input required name="contact" class="mt-2 block w-full rounded-xl border p-3"></label><label class="text-sm font-bold">Blood group<select name="blood_type" class="mt-2 block w-full rounded-xl border p-3 bg-white">{% for g in blood_groups %}<option>{{g}}</option>{% endfor %}</select></label><label class="text-sm font-bold">Units needed<input type="number" min="1" max="100" name="units_needed" value="1" required class="mt-2 block w-full rounded-xl border p-3"></label><label class="text-sm font-bold">Hospital<input required name="hospital" class="mt-2 block w-full rounded-xl border p-3"></label><label class="text-sm font-bold">City<input required name="city" class="mt-2 block w-full rounded-xl border p-3"></label><label class="text-sm font-bold sm:col-span-2">Urgency<select name="urgency" class="mt-2 block w-full rounded-xl border p-3 bg-white"><option value="routine">Routine</option><option value="urgent" selected>Urgent</option><option value="critical">Critical</option></select></label><button class="sm:col-span-2 bg-red-600 text-white rounded-xl p-3.5 font-bold">Submit for review</button></form></div></section>{% endblock %}
